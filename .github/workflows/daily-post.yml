name: Daily Auto Post

on:
  schedule:
    - cron: '0 3 * * *'   # 매일 03:00 UTC = 한국시간 오후 12:00 (GitHub 스케줄은 수~수십 분 지연될 수 있음)
  workflow_dispatch:       # Actions 탭에서 수동 실행(테스트용)
    inputs:
      force:
        description: '오늘 날짜 글이 있어도 강제로 새 글 작성'
        type: boolean
        default: false
  push:                    # 이 파일을 수정해 푸시하면 즉시 강제 실행 (로그인 없이 git만으로 테스트)
    branches: [main]
    paths: ['.github/triggers/daily-post']

permissions:
  contents: write   # 새 글 커밋·푸시
  actions: write    # 배포 워크플로우(deploy.yml) 호출

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  write_post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Skip if today's post already exists
      id: guard
      run: |
        TODAY=$(date +%F)
        echo "today=$TODAY" >> "$GITHUB_OUTPUT"
        if [ "${{ inputs.force }}" != "true" ] && [ "${{ github.event_name }}" != "push" ] && grep -lq "^date: '$TODAY'" blog-front/contents/*.md; then
          echo "오늘($TODAY) 날짜 글이 이미 있어 건너뜁니다."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Pillow and Korean fonts
      if: steps.guard.outputs.skip != 'true'
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
        pip install --quiet pillow

    # Gemini API는 딱 1회만 호출 (무료 등급 한도: 모델당 하루 약 20회). 저장·이미지·README 갱신은 스크립트가 처리
    - name: Write today's post with Gemini
      if: steps.guard.outputs.skip != 'true'
      timeout-minutes: 20
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # Google AI Studio 무료 API 키
        GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}         # 비우면 scripts/auto_post.py 기본 목록 사용 (앞에서부터, 한도 초과 시 다음 모델)
        TODAY: ${{ steps.guard.outputs.today }}
      run: |
        [ -n "$GEMINI_API_KEY" ] || { echo "GEMINI_API_KEY 시크릿이 없습니다"; exit 1; }
        [ -n "$GEMINI_MODELS" ] || unset GEMINI_MODELS
        set -o pipefail
        python3 scripts/auto_post.py 2>&1 | tee /tmp/auto_post.log

    # 실패 시 로그 끝부분을 annotation으로 남김 (로그인 없이 API로 원인 확인 가능)
    - name: Report log tail on failure
      if: failure()
      run: |
        [ -f /tmp/auto_post.log ] || exit 0
        TAIL=$(tail -c 3000 /tmp/auto_post.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')
        echo "::error title=auto_post log tail::$TAIL"

    - name: Validate new post
      if: steps.guard.outputs.skip != 'true'
      env:
        TODAY: ${{ steps.guard.outputs.today }}
      run: |
        git add -A
        NEW=$(git diff --cached --name-only --diff-filter=A -- 'blog-front/contents/*.md')
        [ "$(echo "$NEW" | grep -c .)" = "1" ] || { echo "새 .md 파일이 정확히 1개여야 합니다: [$NEW]"; exit 1; }
        grep -q "^date: '$TODAY'" "$NEW" || { echo "date 필드 오류"; exit 1; }
        for f in title categories summary thumbnail comments; do
          grep -q "^$f:" "$NEW" || { echo "프론트매터 $f 누락"; exit 1; }
        done
        THUMB=$(sed -n "s/^thumbnail: '\.\/\(.*\)'/\1/p" "$NEW")
        [ -f "blog-front/contents/$THUMB" ] || { echo "썸네일 파일 없음: $THUMB"; exit 1; }
        for img in $(grep -o '(\./images/[^)]*)' "$NEW" | tr -d '()'); do
          [ -f "blog-front/contents/${img#./}" ] || { echo "본문 이미지 없음: $img"; exit 1; }
        done
        SIZE=$(wc -c < "$NEW"); echo "size=$SIZE bytes"
        [ "$SIZE" -gt 10000 ] || { echo "본문이 너무 짧습니다"; exit 1; }
        echo "NEW_POST=$NEW" >> "$GITHUB_ENV"

    - name: Commit and push
      if: steps.guard.outputs.skip != 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        TITLE=$(sed -n "s/^title: '\(.*\)'/\1/p" "$NEW_POST")
        git commit -m "[auto] $TITLE"
        git push origin HEAD:main

    # GITHUB_TOKEN으로 한 push는 다른 워크플로우를 트리거하지 않으므로 배포를 직접 호출
    - name: Trigger deploy
      if: steps.guard.outputs.skip != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run deploy.yml --ref main
