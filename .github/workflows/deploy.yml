name: Build and Deploy to io Repo

on:
  push:
    branches:
      - main  # main 브랜치에 푸시될 때마다 실행
  workflow_dispatch:  # daily-post.yml 에서 호출 (GITHUB_TOKEN 푸시는 push 트리거를 발생시키지 않음)
  schedule:
    - cron: '0 0 * * *'  # 매일 00:00 UTC에 실행

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Techlog repository
      uses: actions/checkout@v3
      with:
        submodules: true  # 필요한 경우 서브모듈 체크아웃

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd blog-front  # blog-front 디렉토리로 이동
        npm install  # 의존성 설치
        npm install -g gatsby-cli  # gatsby-cli 글로벌 설치

    # 공개 조회수 JSON 생성 (선택). 토큰은 이 단계에서만 쓰고 결과 파일에는 경로·숫자만 남음.
    # 토큰이 없거나 API가 실패하면 공개 카운터로 게시글마다 조회, 그것도 실패하면 통계 영역만 숨기고 배포는 계속. 생성 파일은 커밋하지 않음
    - name: Fetch view stats from GoatCounter (optional)
      continue-on-error: true
      timeout-minutes: 10
      env:
        GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        GATSBY_GOATCOUNTER_ENDPOINT: ${{ vars.GATSBY_GOATCOUNTER_ENDPOINT || secrets.GATSBY_GOATCOUNTER_ENDPOINT }}
        GOATCOUNTER_STATS_START: ${{ vars.GOATCOUNTER_STATS_START }}
      run: python3 scripts/fetch_stats.py

    - name: Build the project
      env:
        # 공개 측정용 값(비밀 아님). 비어 있으면 GA4·GoatCounter 스크립트를 넣지 않고 빌드
        GATSBY_GA_MEASUREMENT_ID: ${{ vars.GATSBY_GA_MEASUREMENT_ID || secrets.GATSBY_GA_MEASUREMENT_ID }}
        GATSBY_GOATCOUNTER_ENDPOINT: ${{ vars.GATSBY_GOATCOUNTER_ENDPOINT || secrets.GATSBY_GOATCOUNTER_ENDPOINT }}
      run: |
        cd blog-front  # blog-front 디렉토리로 이동
        gatsby build  # Gatsby 빌드

    - name: Checkout io repository
      uses: actions/checkout@v3
      with:
        repository: Logic-Phantom/Logic-Phantom.github.io # io 레포지토리
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        path: io_repo  # 다른 경로에 체크아웃 (io_repo로 명명)

    - name: Clean and copy build files to io repo
      run: |
        # 기존 파일들 삭제 (숨김 파일 제외)
        cd io_repo
        find . -type f ! -name '.git*' ! -path './.*' -delete
        find . -type d ! -name '.git*' ! -path './.*' -empty -delete
        cd ..
        # 새로운 빌드 파일들 복사
        cp -r blog-front/public/* io_repo/

    - name: Commit and push to io repo
      run: |
        cd io_repo  # io_repo 디렉토리로 이동
        git config --global user.name "임채명"
        git config --global user.email "dlacoaud92@naver.com"
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "Deploy latest build"
          git push origin master  # io 레포지토리의 master 브랜치에 푸시
        else
          echo "No changes to commit"
        fi